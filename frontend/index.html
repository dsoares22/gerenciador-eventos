<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Eventos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Eventos</h1>
    <a href="categorias.html">Ir para categorias</a>

    <h2>Cadastro</h2>
    <form id="form">
      <input type="hidden" id="id" />
      <label>Título <input type="text" id="title" /></label>
      <label>Descrição <input type="text" id="description" /></label>
      <label>Data <input type="date" id="date" /></label>
      <label>Horário <input type="time" id="time" /></label>
      <label>Local <input type="text" id="location" /></label>
      <label
        >Categoria
        <select id="category">
          <option value="">Selecione</option>
        </select>
      </label>
      <button type="submit">Salvar</button>
      <button type="reset">Limpar</button>
    </form>

    <h2>Filtros</h2>
    <form id="filters">
      <label>Título <input type="text" id="filter-title" /></label>
      <label
        >Categoria
        <select id="filter-category">
          <option value="">Todas</option>
        </select>
      </label>
      <label>De <input type="date" id="filter-start" /></label>
      <label>Até <input type="date" id="filter-end" /></label>
      <button type="submit">Filtrar</button>
      <button type="reset">Limpar filtros</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Título</th>
          <th>Data</th>
          <th>Horário</th>
          <th>Local</th>
          <th>Categoria</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="events"></tbody>
    </table>

    <script src="js/api.js"></script>
    <script src="js/eventos.js"></script>
  </body>
</html>
